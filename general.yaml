  - RULE-SET,GPT,🤖️ GPT
  - RULE-SET,GPT_Domain,🤖️ GPT
  - RULE-SET,GPT_IP,🤖️ GPT
  - RULE-SET,US,🇺🇸 美国
  - RULE-SET,US_Domain,🇺🇸 美国
  - RULE-SET,US_IP,🇺🇸 美国
  - RULE-SET,HK_Domain,🇭🇰 香港
  - RULE-SET,Mainland_Domain,🎯 全球直连
  - RULE-SET,Manual_Domain,🚀 普通代理
  - RULE-SET,Manual_IP,🚀 普通代理
  - RULE-SET,icloud,🍎 苹果服务
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,FRP,🕳️ 内网穿透
  - RULE-SET,Finance,㊙️ 特殊链接
  - RULE-SET,Finance_Domain,㊙️ 特殊链接
  - RULE-SET,google,🚀 普通代理
  - RULE-SET,proxy,🚀 普通代理
  - RULE-SET,direct,🎯 全球直连
  - RULE-SET,lancidr,🎯 全球直连
  - RULE-SET,cncidr,🎯 全球直连
  - RULE-SET,telegramcidr,🚀 普通代理
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,🎯 全球直连
  - MATCH,🐟 漏网之鱼

