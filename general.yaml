port: 7892
socks-port: 7891
mixed-port: 7890
allow-lan: true
mode: rule
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
keep-alive-interval: 30
tcp-concurrent: false
ipv6: true
log-level: info
unified-delay: true
global-client-fingerprint: chrome
external-controller: 0.0.0.0:9090
secret: 123456
experimental:
  ignore-resolve-fail: true
dns:
  ipv6: true
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
    - tls://223.5.5.5:853
    - https://223.5.5.5/dns-query
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - "*.n.n.srv.nintendo.net"
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - "*.*.xboxlive.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "*.mcdn.bilivideo.cn"
    - +.aihubmix.com
    - +.packyapi.com
    - +.work.weixin.qq.com
    - +.mre.red
    - +.c-1o.top
    - WORKGROUP
  nameserver:
    - 218.30.19.40
    - 211.137.130.2
    - 221.11.1.67
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - +.google.+
      - +.googleapis.com
      - +.googlevideo.com
      - +.gstatic.cn
      - +.gstatic.com
      - +.gvt1.com
      - +.gvt2.com
      - +.recaptcha.net
      - +.twimg.com
      - +.twitter.com
      - +.youtube.com
      - +.ytimg.com
      - twitter.com
      - t.co
      - t.me
      - telegra.ph
      - youtu.be
  nameserver-policy:
    geosite:cn,private:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    geosite:category-ads-all: rcode://success
    "*.alibaba.cn": 223.5.5.5
    "*.alibaba.com.cn": 223.5.5.5
    "*.china.alibaba.com": 223.5.5.5
    "*.1688.com": 223.5.5.5
    "*.taobao.com": 223.5.5.5
    "*.tbcache.com": 223.5.5.5
    "*.tmall.com": 223.5.5.5
    "*.alicdn.com": 223.5.5.5
    "*.aliyundrive.com": 223.5.5.5
    "*.aliyun.*": 223.5.5.5
    "*.aliyuncdn.*": 223.5.5.5
    "*.aliyunddos????.com": 223.5.5.5
    "*.aliyuncs.com": 223.5.5.5
    "*.aliyundunwaf.com": 223.5.5.5
    "*.aliapp.com": 223.5.5.5
    "*.aliapp.org": 223.5.5.5
    "*.alibabausercontent.com": 223.5.5.5
    "*.mmstat.com": 223.5.5.5
    tb.cn: 223.5.5.5
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
hosts:
  "*imap.mail.icloud.com.cn": 17.56.9.15
  "*smtp.mail.icloud.com.cn": 17.56.8.137
tun:
  enable: true
  stack: gvisor
  dns-hijack: []
  auto-route: true
  auto-detect-interface: true
  mtu: 1500
  strict-route: false
  device: utun1500
  auto-redirect: false
  route-exclude-address: []
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
    QUIC:
      ports:
        - 443
        - 8443
proxies:

proxy-groups:
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 普通代理
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 🚀 普通代理
  - name: 🚀 普通代理
    type: select
    proxies:
      - 🔗 Azure 均衡
      - ㊙️ 特殊链接
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🤖️ GPT
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    proxies:
      - KC01
      - SG01
      - SG02
      - JP01
      - JP02
      - US01
  - name: ㊙️ 特殊链接
    type: select
    proxies:
      - DIRECT
      - HK01
      - HK02
      - SG01
      - SG02
      - KC01
      - JP01
      - JP02
      - US01
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🇺🇸 美国
      - 🚀 普通代理
  - name: 🔗 Azure 均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - HK01
      - HK02
      - KC01
      - SG01
      - SG02
      - JP01
      - JP02
      - US01
  - name: 🇭🇰 香港
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - HK01
      - HK02
  - name: 🇸🇬 新加坡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - SG01
      - SG02
  - name: 🇰🇷 韩国
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - KC01
  - name: 🇯🇵 日本
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - JP01
      - JP02
  - name: 🇺🇸 美国
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    lazy: true
    proxies:
      - US01
  - name: 🕳️ 内网穿透
    type: select
    proxies:
      - DIRECT
      - 🚀 普通代理
rules:
  - RULE-SET,applications,🎯 全球直连
  - RULE-SET,private,🎯 全球直连
  - RULE-SET,reject,🛑 广告拦截
  - RULE-SET,Speedtest,㊙️ 特殊链接
